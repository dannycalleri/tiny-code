[package]
name = "turbo-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6"
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
libc = "0.2"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
egui_kittest = "0.37"
